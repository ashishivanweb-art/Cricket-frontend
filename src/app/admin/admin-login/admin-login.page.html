<ion-content class="dark-bg text-white">

  <div class="p-5 space-y-8">

    
    <div class="space-y-1">
      <h1 class="text-3xl font-bold tracking-wide">🏏 Cricket Live</h1>
      <p class="text-slate-400 text-sm">Admin Login Panel</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card p-6 space-y-5 max-w-md mx-auto">

      <!-- Email -->
      <div>
        <label class="text-sm text-slate-400">Email</label>
       <input
    type="email"
    name="email"
    [(ngModel)]="email"
    #emailRef="ngModel"
    required
    email
    placeholder="Enter admin email"
    class="w-full mt-1 p-3 rounded-lg bg-slate-800
           text-white placeholder-slate-500
           border border-slate-700
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />


  <p *ngIf="emailRef.invalid && emailRef.touched"
     class="text-red-400 text-sm mt-1">
     Please enter a valid email
  </p>
      </div>

      <!-- Password -->
      <div>
        <label class="text-sm text-slate-400">Password</label>
        <input
    type="password"
    name="password"
    [(ngModel)]="password"
    #passwordRef="ngModel"
    required
    minlength="6"
    placeholder="Enter password"
    class="w-full mt-1 p-3 rounded-lg bg-slate-800
           text-white placeholder-slate-500
           border border-slate-700
           focus:outline-none focus:ring-2 focus:ring-blue-500"
  />

  <!-- Error -->
  <p *ngIf="passwordRef.invalid && passwordRef.touched"
     class="text-red-400 text-sm mt-1">
     Password must be at least 6 characters
  </p>
      </div>

      <!-- Button -->
      <button
        (click)="login()"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700
               p-3 rounded-lg font-semibold
               transition-all duration-200 active:scale-95"
      >
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading">Logging in...</span>
      </button>

    </div>

  </div>

</ion-content>
