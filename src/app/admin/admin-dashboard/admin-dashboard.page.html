<ion-content class="dark-bg text-white">

  <div class="p-5 space-y-6">

    <!-- Header -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">⚙️ Admin Dashboard</h1>
        <p class="text-slate-400 text-sm">
          Manage matches & scoring
        </p>
      </div>

      <button
        (click)="logout()"
        class="bg-red-600 px-4 py-2 rounded-lg
               text-sm font-semibold
               hover:bg-red-700 transition"
      >
        Logout
      </button>
    </div>

    <!-- Actions Grid -->
    <div class="grid grid-cols-2 gap-4">

      <button class="glass-card p-5 text-left hover:scale-105 transition">
        ➕ Create Match
      </button>

      <button class="glass-card p-5 text-left hover:scale-105 transition">
        📋 View Matches
      </button>

      <button class="bg-purple-600 hover:bg-purple-700
               px-5 py-3 rounded-xl
               transition shadow-lg" (click)="goToSeries()">
      
        🏆 Manage Series
      
      </button>

     <button
  (click)="goToTeams()"
  class="glass-card p-5 text-left hover:scale-105 transition">
  👥 Manage Teams
</button>

    </div>

  </div>

</ion-content>
