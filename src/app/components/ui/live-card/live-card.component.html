<div
  class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-700 text-white animate-fadeIn"
>
  <p class="text-xs text-gray-400 mb-2">LIVE MATCH • {{ venue }}</p>

  <!-- Teams Row -->
  <div class="flex items-start justify-between text-center">

    <!-- Team A -->
    <div class="flex flex-col items-start">
      <h2 class="text-md font-bold">{{ teamA }}</h2>
      <p class="text-2xl font-extrabold mt-1">{{ teamAScore }}</p>
    </div>

    <!-- VS -->
    <div class="flex flex-col items-center justify-center mt-2">
      <p class="text-gray-400 font-semibold">vs</p>
    </div>

    <!-- Team B -->
    <div class="flex flex-col items-end">
      <h2 class="text-md font-bold">{{ teamB }}</h2>
      <p class="text-2xl font-extrabold mt-1">{{ teamBScore }}</p>
    </div>

  </div>

  <!-- Overs + Status -->
  <div class="mt-4 text-center">
    <p class="text-sm text-gray-400">Overs {{ overs }}</p>
    <p class="text-sm text-green-400 font-semibold">{{ status }}</p>
  </div>

  <button
    class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 transition rounded-xl py-2 font-semibold"
    (click)="viewScorecard.emit()"
  >
    View Scorecard
  </button>
</div>
