<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Matches</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let m of matches" (click)="openMatch(m._id)">
      <ion-label>
        <h2>
          {{ m.teamA.name }} vs {{ m.teamB.name }}
        </h2>

        <p>
          📍 {{ m.venue }}
        </p>

        <p>
          Status: {{ m.status }}
        </p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
